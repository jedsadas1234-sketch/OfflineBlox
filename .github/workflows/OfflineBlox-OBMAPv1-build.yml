
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK and CMake
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using SDK Manager: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Locate and extract source ZIP
        shell: bash
        run: |
          if [ -f settings.gradle.kts ]; then
            DIR="."
          else
            ZIP="$(find . -maxdepth 1 -type f -name '*.zip' -printf '%f\n' | sort -V | tail -n 1)"

            if [ -z "$ZIP" ]; then
              echo "ERROR: Source ZIP not found"
              exit 1
            fi

            echo "Using ZIP: $ZIP"
            mkdir -p proj
            unzip -q "$ZIP" -d proj

            DIR="$(find proj -name settings.gradle.kts -print -quit | xargs dirname)"

            if [ -z "$DIR" ]; then
              echo "ERROR: settings.gradle.kts not found"
              exit 1
            fi
          fi

          echo "Project directory: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Locate APK
        run: |
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not generated"
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineBlox-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
