name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1" "ndk;26.1.10909125"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          if [ -f settings.gradle.kts ]; then
            DIR=.
          else
            ZIP="$(git -c core.quotepath=off log --name-only --pretty=format: -- '*.zip' | while IFS= read -r f; do if [ -n "$f" ] && [ -f "$f" ]; then echo "$f"; break; fi; done)"
            if [ -z "$ZIP" ]; then ZIP="$(ls *.zip | sort -V | tail -n1)"; fi
            echo "Using zip: $ZIP"
            unzip -q "$ZIP" -d proj
            DIR="$(dirname "$(find proj -name settings.gradle.kts | head -n1)")"
          fi
          echo "Project dir: $DIR"
          cd "$DIR"
          gradle assembleDebug --stacktrace
          echo "APK_DIR=$PWD/app/build/outputs/apk/debug" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineBlox-debug-apk
          path: ${{ env.APK_DIR }}/*.apk
