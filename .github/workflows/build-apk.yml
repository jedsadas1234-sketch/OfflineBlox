name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: unzip -q OfflineBlox-project1.zip
      - run: gradle assembleDebug --stacktrace
        working-directory: OfflineBlox
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineBlox-debug-apk
          path: OfflineBlox/app/build/outputs/apk/debug/app-debug.apk
