name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: |
          if [ -f settings.gradle.kts ]; then
            DIR=.
          else
            unzip -q OfflineBlox-project01.zip -d proj
            DIR="$(dirname "$(find proj -name settings.gradle.kts | head -n1)")"
          fi
          echo "Project dir: $DIR"
          cd "$DIR"
          gradle assembleDebug --stacktrace
          echo "APK_DIR=$PWD/app/build/outputs/apk/debug" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: OfflineBlox-debug-apk
          path: ${{ env.APK_DIR }}/*.apk
