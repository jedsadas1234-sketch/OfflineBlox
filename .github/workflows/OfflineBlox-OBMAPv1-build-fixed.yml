name: OfflineBlox OBMAP v1 Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build OfflineBlox APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The source ZIP contains the Android project inside OfflineBlox/
      - name: Extract OfflineBlox source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -name 'OfflineBlox-OBMAPv1-source.zip' -print -quit)"

          if [ -n "$ZIP_FILE" ]; then
            mkdir -p "$RUNNER_TEMP/offlineblox-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/offlineblox-source"
            SEARCH_ROOT="$RUNNER_TEMP/offlineblox-source"
          else
            # Also allow the source project to be committed already extracted.
            SEARCH_ROOT="$GITHUB_WORKSPACE"
          fi

          SETTINGS_FILE="$(find "$SEARCH_ROOT" -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::Could not find settings.gradle.kts. Upload OfflineBlox-OBMAPv1-source.zip to the repository root, or commit the extracted OfflineBlox project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and native build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineBlox-OBMAPv1-debug
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk"
          if-no-files-found: error
          retention-days: 14
