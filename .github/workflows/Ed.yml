
name: Build Editor APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract Project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_NAME="OfflineBloxEditor-project.zip"

          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::ZIP not found: $ZIP_NAME"
            exit 1
          fi

          mkdir -p proj
          unzip -q "$ZIP_NAME" -d proj

          SETTINGS="$(find proj -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file not found!"
            exit 1
          fi

          DIR="$(dirname "$SETTINGS")"

          echo "Project directory: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: ${{ steps.project.outputs.dir }}

      - name: Build APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.project.outputs.dir }}"

          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineBloxEditor-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
