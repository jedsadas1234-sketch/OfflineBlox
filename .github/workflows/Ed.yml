
name: Build Editor APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build
        shell: bash
        run: |
          set -euo pipefail

          # ใส่ชื่อ ZIP ที่ต้องการตรงนี้
          ZIP_NAME="OfflineBloxEditor-project.zip"

          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            DIR="."
          else
            if [ ! -f "$ZIP_NAME" ]; then
              echo "::error::ZIP not found: $ZIP_NAME"
              exit 1
            fi

            mkdir -p proj
            unzip -q "$ZIP_NAME" -d proj

            SETTINGS="$(find proj -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -print -quit)"

            if [ -z "$SETTINGS" ]; then
              echo "::error::Gradle settings file not found!"
              exit 1
            fi

            DIR="$(dirname "$SETTINGS")"
          fi

          cd "$DIR"
          gradle assembleDebug --stacktrace

          echo "APK_DIR=$PWD/app/build/outputs/apk/debug" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineBloxEditor-debug-apk
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error
          retention-days: 14
          
