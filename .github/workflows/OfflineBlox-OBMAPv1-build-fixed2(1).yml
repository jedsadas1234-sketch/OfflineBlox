name: OfflineBlox OBMAP v1 Build

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OfflineBlox APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Do not add the obsolete "tools" package. It is no longer available
          # from the Android SDK package repository.
          packages: |
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;26.1.10909125
            cmake;3.22.1

      - name: Locate and extract source ZIP (if supplied)
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'OfflineBlox-OBMAPv1-source.zip' -print -quit)"
          if [ -n "$ZIP_FILE" ]; then
            mkdir -p source
            unzip -q "$ZIP_FILE" -d source
            echo "SOURCE_ROOT=$GITHUB_WORKSPACE/source" >> "$GITHUB_ENV"
          else
            echo "SOURCE_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi

      - name: Find Android project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$SOURCE_ROOT"
          SETTINGS="$(find "$ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Could not find settings.gradle or settings.gradle.kts under $ROOT"
            echo "Repository files:"
            find "$ROOT" -maxdepth 4 -type f | head -200
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [ -f ./gradlew ] && [ -f ./gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            echo "Gradle wrapper or wrapper JAR missing; using installed Gradle 8.7"
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OfflineBlox-OBMAPv1-debug
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
